name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests + submission validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install rank-time deps + test tooling
        run: |
          python -m pip install --upgrade pip
          # Only the rank-time runtime (what rank.py and the test suite import).
          # The heavy precompute stack (torch, sentence-transformers) is deliberately
          # out of CI scope — it never runs at rank-time and is not needed by tests.
          pip install numpy==2.2.6 pandas==2.3.3 PyYAML==6.0.2
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

      - name: Validate submission format (graded artifact)
        run: python validate_submission.py submission.csv
